<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高考模拟游戏 - 士多啤梨除草机</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #f8f9fa;
            overflow-x: hidden;
        }

        /* 导航栏 - 保持风格统一 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .navbar-content {
            width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #007bff;
            text-decoration: none;
        }

        .nav-menu a {
            margin: 0 12px;
            color: #333;
            text-decoration: none;
            font-size: 16px;
        }

        .nav-menu a:hover {
            color: #007bff;
        }

        /* 返回按钮 */
        .back-btn {
            position: fixed;
            top: 70px;
            left: 20px;
            padding: 8px 16px;
            background: #6c757d;
            color: white;
            border-radius: 4px;
            text-decoration: none;
            font-size: 14px;
            z-index: 100;
        }

        /* 游戏主容器 */
        .game-container {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            z-index: 10;
            overflow-y: auto;
        }

        /* 游戏标题 */
        .game-title {
            font-size: 36px;
            color: #2c3e50;
            margin: 20px 0 20px 0;
            text-align: center;
        }

        /* 选择科目界面 */
        .subject-selection {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin: 20px 0;
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        .section-title {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .section-desc {
            color: #666;
            margin-bottom: 20px;
        }

        .subjects-group {
            margin: 20px 0;
        }

        .group-title {
            font-size: 18px;
            color: #007bff;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .mandatory-subjects {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .optional-subjects {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 20px;
        }

        .subject-btn {
            padding: 20px 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .subject-btn:hover {
            background: #0056b3;
        }

        .subject-btn.selected {
            background: #28a745;
            box-shadow: 0 0 10px rgba(40, 167, 69, 0.5);
        }

        .subject-btn.optional.selected {
            background: #ffc107;
            color: #212529;
        }

        .selected-count {
            margin: 10px 0;
            font-size: 16px;
            color: #666;
        }

        .start-btn {
            padding: 14px 48px;
            font-size: 20px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 20px;
        }

        .start-btn:hover {
            background: #0056b3;
        }

        .start-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        /* 游戏主界面 */
        .game-main {
            display: none;
            width: 100%;
            max-width: 1200px;
        }

        /* 游戏头部信息 */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #007bff;
        }

        .level-info {
            font-size: 24px;
            color: #2c3e50;
            font-weight: bold;
        }

        .player-stats {
            display: flex;
            gap: 20px;
        }

        .stat-box {
            background: white;
            border-radius: 10px;
            padding: 10px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
            min-width: 100px;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
        }

        /* 战斗区域 */
        .battle-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .enemy-container {
            text-align: center;
            flex: 1;
        }

        .enemy-card {
            width: 200px;
            height: 300px;
            margin: 0 auto;
            background: linear-gradient(135deg, #3498db, #2c3e50);
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .enemy-card:hover {
            transform: scale(1.05);
        }

        .enemy-image {
            width: 100%;
            height: 100%;
            background-color: #2c3e50;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 36px;
            font-weight: bold;
        }

        .enemy-info {
            margin-top: 20px;
        }

        .enemy-name {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .enemy-health {
            font-size: 20px;
            color: #e74c3c;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .enemy-difficulty {
            font-size: 16px;
            color: #f39c12;
            font-weight: bold;
        }

        /* 卡牌区域 */
        .card-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .card {
            width: 150px;
            height: 220px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 12px 25px rgba(0,0,0,0.2);
        }

        .card-image {
            width: 100%;
            height: 140px;
            background-color: #e67e22;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 36px;
            font-weight: bold;
        }

        .card-name {
            font-size: 18px;
            font-weight: bold;
            color: white;
            margin: 10px 0;
        }

        .card-description {
            font-size: 12px;
            color: rgba(255,255,255,0.9);
            padding: 0 10px;
            text-align: center;
            line-height: 1.4;
        }

        .card-cost {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            color: #e67e22;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        /* 商店界面 */
        .shop-area {
            display: none;
            margin: 20px 0;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            text-align: center;
        }

        .shop-title {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .shop-cards {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .shop-card {
            width: 150px;
            height: 220px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .shop-card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 12px 25px rgba(0,0,0,0.2);
        }

        .shop-card.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .shop-card.disabled:hover {
            transform: none;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .shop-card-image {
            width: 100%;
            height: 140px;
            background-color: #2ecc71;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 36px;
            font-weight: bold;
        }

        .shop-card-name {
            font-size: 18px;
            font-weight: bold;
            color: white;
            margin: 10px 0;
        }

        .shop-card-description {
            font-size: 12px;
            color: rgba(255,255,255,0.9);
            padding: 0 10px;
            text-align: center;
            line-height: 1.4;
        }

        .shop-card-price {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            color: #27ae60;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        /* 日志区域 */
        .log-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .log-title {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .log-content {
            color: #666;
            line-height: 1.6;
            font-size: 14px;
        }

        .log-entry {
            margin-bottom: 5px;
            padding-left: 15px;
            border-left: 3px solid #007bff;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .battle-area {
                flex-direction: column;
                gap: 40px;
            }
            
            .mandatory-subjects {
                flex-direction: column;
            }
            
            .optional-subjects {
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            }
            
            .card-container, .shop-cards {
                flex-direction: column;
                align-items: center;
            }
            
            .game-header {
                flex-direction: column;
                gap: 15px;
            }
            
            .player-stats {
                width: 100%;
                justify-content: space-around;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="navbar-content">
            <a href="index.html" class="logo">士多啤梨除草机</a>
            <div class="nav-menu">
                <a href="index.html">首页</a>
                <a href="fun-tools.html">趣味组件</a>
                <a href="blog.html">个人博客</a>
                <a href="games.html">小游戏</a>
                <a href="#">联系我</a>
            </div>
        </div>
    </nav>

    <!-- 返回按钮 -->
    <a href="games.html" class="back-btn">← 返回小游戏合集</a>

    <!-- 游戏容器 -->
    <div class="game-container">
        <h1 class="game-title">高考模拟游戏</h1>

        <!-- 选择科目界面 -->
        <div class="subject-selection" id="subjectSelection">
            <h2 class="section-title">选择你的考试科目</h2>
            <p class="section-desc">高考模式：语数英必考 + 6选3选考科目</p>
            
            <!-- 必考科目 -->
            <div class="subjects-group">
                <div class="group-title">必考科目（全部自动选中）</div>
                <div class="mandatory-subjects">
                    <button class="subject-btn selected" data-subject="语文">📚<br>语文</button>
                    <button class="subject-btn selected" data-subject="数学">🔢<br>数学</button>
                    <button class="subject-btn selected" data-subject="英语">🇬🇧<br>英语</button>
                </div>
            </div>
            
            <!-- 选考科目 -->
            <div class="subjects-group">
                <div class="group-title">选考科目（请选择3门）</div>
                <div class="optional-subjects">
                    <button class="subject-btn optional" data-subject="物理">⚛️<br>物理</button>
                    <button class="subject-btn optional" data-subject="化学">🧪<br>化学</button>
                    <button class="subject-btn optional" data-subject="生物">🧬<br>生物</button>
                    <button class="subject-btn optional" data-subject="历史">📜<br>历史</button>
                    <button class="subject-btn optional" data-subject="地理">🌍<br>地理</button>
                    <button class="subject-btn optional" data-subject="政治">⚖️<br>政治</button>
                </div>
                <div class="selected-count" id="selectedCount">已选择 0/3 门选考科目</div>
            </div>
            
            <button class="start-btn" id="start-game" disabled>开始高考</button>
        </div>

        <!-- 游戏主界面 -->
        <div class="game-main" id="gameMain">
            <!-- 游戏头部信息 -->
            <div class="game-header">
                <div class="level-info" id="currentLevel">第 1 门考试</div>
                <div class="player-stats">
                    <div class="stat-box">
                        <div class="stat-label">总分</div>
                        <div class="stat-value" id="playerScore">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">学识</div>
                        <div class="stat-value" id="playerKnowledge">10</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">当前科目</div>
                        <div class="stat-value" id="currentSubject">-</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">当前关卡</div>
                        <div class="stat-value" id="currentStage">1</div>
                    </div>
                </div>
            </div>

            <!-- 战斗区域 -->
            <div class="battle-area" id="battleArea">
                <div class="enemy-container">
                    <div class="enemy-card">
                        <div class="enemy-image" id="enemy-image">?</div>
                    </div>
                    <div class="enemy-info">
                        <div class="enemy-name" id="enemy-name">未知题目</div>
                        <div class="enemy-health" id="enemy-health">血量: 100</div>
                        <div class="enemy-difficulty" id="enemy-difficulty">难度系数: 0.8</div>
                    </div>
                </div>

                <div class="card-area">
                    <div class="card-container" id="card-container">
                        <!-- 战斗信息显示 -->
                        <div style="text-align: center; margin-top: 50px;">
                            <div style="font-size: 24px; color: #2c3e50; margin-bottom: 20px;">战斗中...</div>
                            <div style="font-size: 18px; color: #666;">每回合自动攻击，造成 <span id="attack-power" style="color: #e74c3c; font-weight: bold;">0</span> 点伤害</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 商店区域 -->
            <div class="shop-area" id="shopArea">
                <h3 class="shop-title">知识商店 - 购买学习卡牌提升学识</h3>
                <div class="shop-cards" id="shop-cards">
                    <!-- 商店卡牌将在这里动态生成 -->
                </div>
                <button class="start-btn" id="continue-btn">继续下一题</button>
            </div>

            <!-- 战斗日志 -->
            <div class="log-container">
                <div class="log-title">考试记录</div>
                <div class="log-content" id="battle-log">
                    <div class="log-entry">欢迎来到高考模拟游戏！</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 游戏核心对象
        const game = {
            // DOM元素
            subjectSelection: document.getElementById('subjectSelection'),
            gameMain: document.getElementById('gameMain'),
            battleArea: document.getElementById('battleArea'),

                    { name: "史料分析", description: "培养史学素养", cost: 80, knowledgeGain: 8, icon: "📜" },
                    { name: "因果关系", description: "分析历史因果", cost: 100, knowledgeGain: 10, icon: "🔗" },
                    { name: "史观建构", description: "形成历史观念", cost: 120, knowledgeGain: 12, icon: "🏛️" }
                ],
                地理: [
                    { name: "地图技能", description: "提升读图能力", cost: 50, knowledgeGain: 5, icon: "🗺️" },
                    { name: "气候分析", description: "掌握气候规律", cost: 80, knowledgeGain: 8, icon: "🌤️" },
                    { name: "区域认知", description: "理解区域差异", cost: 100, knowledgeGain: 10, icon: "🌍" },
                    { name: "地理实践", description: "应用地理知识", cost: 120, knowledgeGain: 12, icon: "⛰️" }
                ],
                政治: [
                    { name: "哲学思维", description: "培养辩证思维", cost: 50, knowledgeGain: 5, icon: "💭" },
                    { name: "经济原理", description: "理解经济规律", cost: 80, knowledgeGain: 8, icon: "💰" },
                    { name: "政治制度", description: "掌握制度知识", cost: 100, knowledgeGain: 10, icon: "🏛️" },
                    { name: "时事分析", description: "关注时事热点", cost: 120, knowledgeGain: 12, icon: "📰" }
                ]
            },
            
            // 题目类型数据
            questionTypes: {
                语文: ["选择题", "阅读理解", "作文", "古诗文默写", "语言文字运用"],
                数学: ["选择题", "填空题", "解答题", "概率统计", "解析几何"],
                英语: ["听力", "阅读理解", "完形填空", "语法填空", "写作"],
                物理: ["概念题", "计算题", "实验题", "图像题", "综合应用"],
                化学: ["概念题", "计算题", "实验题", "推断题", "工艺流程"],
                生物: ["概念题", "实验题", "分析题", "遗传题", "生态题"],
                历史: ["选择题", "材料分析", "论述题", "图表题", "改革史"],
                地理: ["选择题", "综合题", "地图题", "区域分析", "环境问题"],
                政治: ["选择题", "主观题", "分析题", "时政题", "哲学题"]
            },
            
            // 初始化游戏
            init() {
                // 绑定选考科目选择事件
                this.optionalSubjectBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const subject = e.target.getAttribute('data-subject');
                        const isSelected = e.target.classList.contains('selected');
                        
                        if (isSelected) {
                            // 取消选择
                            e.target.classList.remove('selected');
                            this.selectedOptionalSubjects = this.selectedOptionalSubjects.filter(s => s !== subject);
                        } else {
                            // 选择科目（最多3门）
                            if (this.selectedOptionalSubjects.length < 3) {
                                e.target.classList.add('selected');
                                this.selectedOptionalSubjects.push(subject);
                            } else {
                                alert('只能选择3门选考科目！');
                                return;
                            }
                        }
                        
                        // 更新计数显示
                        this.updateSelectedCount();
                        
                        // 检查是否满足开始条件
                        this.checkStartCondition();
                    });
                });
                
                // 绑定开始游戏事件
                this.startBtn.addEventListener('click', () => {
                    this.startGame();
                });
                
                // 绑定继续按钮事件
                this.continueBtn.addEventListener('click', () => {
                    this.hideShop();
                    this.startNextBattle();
                });
            },
            
            // 更新选中计数显示
            updateSelectedCount() {
                this.selectedCount.textContent = `已选择 ${this.selectedOptionalSubjects.length}/3 门选考科目`;
            },
            
            // 检查开始条件
            checkStartCondition() {
                if (this.selectedOptionalSubjects.length === 3) {
                    this.startBtn.disabled = false;
                } else {
                    this.startBtn.disabled = true;
                }
            },
            
            // 开始游戏
            startGame() {
                // 合并必考和选考科目
                const mandatorySubjects = ['语文', '数学', '英语'];
                this.totalSubjects = [...mandatorySubjects, ...this.selectedOptionalSubjects];
                
                // 随机打乱科目顺序
                this.shuffleArray(this.totalSubjects);
                
                // 隐藏选择界面，显示游戏主界面
                this.subjectSelection.style.display = 'none';
                this.gameMain.style.display = 'block';
                
                // 初始化游戏状态
                this.gameState = {
                    score: 0,
                    knowledge: 10, // 初始学识值
                    currentSubjectIndex: 0,
                    currentStage: 1, // 当前关卡，4小测1模考
                    subjectsRemaining: this.totalSubjects.length,
                    enemyHealth: 100,
                    enemyMaxHealth: 100,
                    enemyDifficulty: 0.8,
                    isShopPhase: false,
                    battleInterval: null
                };
                
                // 显示初始信息
                this.updateDisplay();
                
                // 开始第一场战斗
                this.startNextBattle();
                
                // 添加开始游戏的日志
                this.addLogEntry(`高考开始！本次考试科目：${this.totalSubjects.join(', ')}`);
            },
            
            // 开始下一场战斗
            startNextBattle() {
                if (this.gameState.currentSubjectIndex >= this.totalSubjects.length) {
                    // 所有科目考试完成
                    this.gameComplete();
                    return;
                }
                
                const currentSubject = this.totalSubjects[this.gameState.currentSubjectIndex];
                
                // 更新当前科目信息
                this.currentSubject.textContent = currentSubject;
                this.currentStage.textContent = this.gameState.currentStage;
                
                // 生成题目
                this.generateQuestion(currentSubject);
                
                // 开始战斗循环
                this.startBattleLoop();
            },
            
            // 生成题目
            generateQuestion(subject) {
                // 获取该科目的题目类型
                const types = this.questionTypes[subject] || ["综合题"];
                const randomType = types[Math.floor(Math.random() * types.length)];
                
                // 生成随机题目名称
                const questionNames = [
                    `${subject}难题`, `${randomType}`, `压轴题`, `易错题`, 
                    `重点题`, `难点突破`, `综合应用`, `创新题`, `基础题`, `提高题`
                ];
                const questionName = questionNames[Math.floor(Math.random() * questionNames.length)];
                
                // 根据关卡设置难度和血量
                let baseHealth, baseDifficulty;
                
                // 4小测1模考的规律：1-4为小测，5为模考
                if (this.gameState.currentStage % 5 === 0) {
                    // 模考（第5、10、15...关）
                    baseHealth = 150 + Math.floor(Math.random() * 50); // 150-200
                    baseDifficulty = 0.6 + Math.random() * 0.2; // 0.6-0.8（减伤更多）
                    this.addLogEntry(`🎯 模考题目！难度更高，小心应对！`);
                } else {
                    // 小测（其他关卡）
                    baseHealth = 80 + Math.floor(Math.random() * 40); // 80-120
                    baseDifficulty = 0.7 + Math.random() * 0.2; // 0.7-0.9
                }
                
                // 更新敌人信息
                this.gameState.enemyMaxHealth = baseHealth;
                this.gameState.enemyHealth = baseHealth;
                this.gameState.enemyDifficulty = baseDifficulty;
                
                // 更新显示
                this.enemyImage.textContent = this.getSubjectIcon(subject);
                this.enemyName.textContent = `${questionName}`;
                this.enemyHealth.textContent = `血量: ${this.gameState.enemyHealth}/${this.gameState.enemyMaxHealth}`;
                this.enemyDifficulty.textContent = `难度系数: ${(this.gameState.enemyDifficulty).toFixed(2)}`;
                this.attackPower.textContent = this.gameState.knowledge;
                
                this.updateDisplay();
            },
            
            // 获取科目图标
            getSubjectIcon(subject) {
                const icons = {
                    '语文': '📚', '数学': '🔢', '英语': '🇬🇧',
                    '物理': '⚛️', '化学': '🧪', '生物': '🧬',
                    '历史': '📜', '地理': '🌍', '政治': '⚖️'
                };
                return icons[subject] || '❓';
            },
            
            // 开始战斗循环
            startBattleLoop() {
                // 清除之前的定时器
                if (this.gameState.battleInterval) {
                    clearInterval(this.gameState.battleInterval);
                }
                
                // 每2秒自动攻击一次
                this.gameState.battleInterval = setInterval(() => {
                    this.autoAttack();
                }, 2000);
            },
            
            // 自动攻击
            autoAttack() {
                const currentSubject = this.totalSubjects[this.gameState.currentSubjectIndex];
                
                // 计算实际伤害（考虑难度系数的减伤效果）
                const rawDamage = this.gameState.knowledge;
                const effectiveDamage = Math.max(1, Math.floor(rawDamage * (1 - this.gameState.enemyDifficulty)));
                
                // 对敌人造成伤害
                this.gameState.enemyHealth -= effectiveDamage;
                if (this.gameState.enemyHealth < 0) this.gameState.enemyHealth = 0;
                
                // 更新显示
                this.enemyHealth.textContent = `血量: ${this.gameState.enemyHealth}/${this.gameState.enemyMaxHealth}`;
                this.updateDisplay();
                
                // 添加日志
                this.addLogEntry(`${currentSubject} - 自动攻击，造成 ${effectiveDamage} 点伤害（难度系数减伤 ${(this.gameState.enemyDifficulty * 100).toFixed(0)}%）！`);
                
                // 检查敌人是否被击败
                if (this.gameState.enemyHealth <= 0) {
                    this.completeBattle();
                }
            },
            
            // 完成战斗
            completeBattle() {
                // 停止战斗循环
                if (this.gameState.battleInterval) {
                    clearInterval(this.gameState.battleInterval);
                    this.gameState.battleInterval = null;
                }
                
                const currentSubject = this.totalSubjects[this.gameState.currentSubjectIndex];
                
                // 根据难度和学识计算得分奖励
                const difficultyBonus = (1 - this.gameState.enemyDifficulty) * 100; // 难度越高奖励越多
                const knowledgeBonus = this.gameState.knowledge * 2; // 学识越高奖励越多
                const baseReward = 20;
                
                const scoreGain = Math.round(baseReward + difficultyBonus + knowledgeBonus);
                this.gameState.score += scoreGain;
                
                // 添加日志
                this.addLogEntry(`🎉 ${currentSubject} 题目解答完成！获得 ${scoreGain} 分！`);
                
                // 显示商店界面
                this.showShop(currentSubject);
            },
            
            // 显示商店
            showShop(subject) {
                this.gameState.isShopPhase = true;
                this.battleArea.style.display = 'none';
                this.shopArea.style.display = 'block';
                
                // 生成3张随机卡牌
                this.generateShopCards(subject);
                
                this.addLogEntry(`🛒 进入知识商店，可用 ${this.gameState.score} 分购买学习卡牌！`);
            },
            
            // 生成商店卡牌
            generateShopCards(subject) {
                this.shopCards.innerHTML = '';
                
                const availableCards = this.subjectCards[subject] || [];
                if (availableCards.length === 0) return;
                
                // 随机选择3张卡牌
                const selectedCards = [];
                const usedIndices = new Set();
                
                while (selectedCards.length < 3 && usedIndices.size < availableCards.length) {
                    const randomIndex = Math.floor(Math.random() * availableCards.length);
                    if (!usedIndices.has(randomIndex)) {
                        usedIndices.add(randomIndex);
                        selectedCards.push(availableCards[randomIndex]);
                    }
                }
                
                selectedCards.forEach(card => {
                    const cardElement = document.createElement('div');
                    cardElement.className = `shop-card ${this.gameState.score < card.cost ? 'disabled' : ''}`;
                    cardElement.innerHTML = `
                        <div class="shop-card-image">${card.icon}</div>
                        <div class="shop-card-name">${card.name}</div>
                        <div class="shop-card-description">${card.description}<br>+${card.knowledgeGain} 学识</div>
                        <div class="shop-card-price">${card.cost}</div>
                    `;
                    
                    if (this.gameState.score >= card.cost) {
                        cardElement.addEventListener('click', () => {
                            this.purchaseCard(card);
                        });
                    }
                    
                    this.shopCards.appendChild(cardElement);
                });
            },
            
            // 购买卡牌
            purchaseCard(card) {
                if (this.gameState.score < card.cost) {
                    this.addLogEntry(`❌ 分数不足，无法购买 ${card.name}！`);
                    return;
                }
                
                // 扣除分数
                this.gameState.score -= card.cost;
                
                // 增加学识
                this.gameState.knowledge += card.knowledgeGain;
                
                // 更新显示
                this.updateDisplay();
                
                // 添加日志
                this.addLogEntry(`✅ 成功购买 "${card.name}"，学识 +${card.knowledgeGain}！`);
                
                // 重新生成商店卡牌（刷新选项）
                const currentSubject = this.totalSubjects[this.gameState.currentSubjectIndex];
                this.generateShopCards(currentSubject);
            },
            
            // 隐藏商店
            hideShop() {
                this.gameState.isShopPhase = false;
                this.shopArea.style.display = 'none';
                this.battleArea.style.display = 'flex';
                
                // 进入下一关
                this.nextStage();
            },
            
            // 进入下一关
            nextStage() {
                this.gameState.currentStage++;
                
                // 检查是否完成当前科目（每科目5关：4小测+1模考）
                if (this.gameState.currentStage % 5 === 1 && this.gameState.currentStage > 1) {
                    // 进入下一科目
                    this.gameState.currentSubjectIndex++;
                    this.gameState.currentStage = 1; // 重置为第1关
                    
                    if (this.gameState.currentSubjectIndex < this.totalSubjects.length) {
                        this.addLogEntry(`🔄 进入下一科目：${this.totalSubjects[this.gameState.currentSubjectIndex]}！`);
                    }
                }
                
                // 更新显示
                this.updateDisplay();
                
                // 开始下一场战斗
                setTimeout(() => {
                    this.startNextBattle();
                }, 1000);
            },
            
            // 游戏完成
            gameComplete() {
                this.addLogEntry(`🏆 高考模拟结束！最终总分：${this.gameState.score}，最终学识：${this.gameState.knowledge}`);
                
                // 根据总分和学识给出评价
                let evaluation = '';
                const avgScorePerSubject = this.gameState.score / this.totalSubjects.length;
                
                if (avgScorePerSubject >= 200 && this.gameState.knowledge >= 100) {
                    evaluation = '🎉 顶尖学霸！清北任你选！';
                } else if (avgScorePerSubject >= 150 && this.gameState.knowledge >= 70) {
                    evaluation = '👍 优秀学生！一本稳了！';
                } else if (avgScorePerSubject >= 100 && this.gameState.knowledge >= 40) {
                    evaluation = '✅ 不错的成绩！二本以上！';
                } else {
                    evaluation = '💪 继续努力！下次会更好！';
                }
                
                this.addLogEntry(evaluation);
                
                // 重新开始按钮
                setTimeout(() => {
                    if (confirm(`高考结束！总分：${this.gameState.score}，学识：${this.gameState.knowledge}\n${evaluation}\n是否重新开始？`)) {
                        this.restartGame();
                    }
                }, 2000);
            },
            
            // 重新开始游戏
            restartGame() {
                // 停止战斗循环
                if (this.gameState.battleInterval) {
                    clearInterval(this.gameState.battleInterval);
                }
                
                this.gameMain.style.display = 'none';
                this.subjectSelection.style.display = 'block';
                
                // 重置选考科目选择状态
                this.optionalSubjectBtns.forEach(btn => {
                    btn.classList.remove('selected');
                });
                this.selectedOptionalSubjects = [];
                this.updateSelectedCount();
                this.startBtn.disabled = true;
            },
            
            // 更新显示
            updateDisplay() {
                this.currentLevel.textContent = `第 ${this.gameState.currentSubjectIndex + 1} 门考试`;
                this.playerScore.textContent = this.gameState.score;
                this.playerKnowledge.textContent = this.gameState.knowledge;
                this.currentStage.textContent = this.gameState.currentStage;
                this.attackPower.textContent = this.gameState.knowledge;
            },
            
            // 添加日志条目
            addLogEntry(text) {
                const logEntry = document.createElement('div');
                logEntry.className = 'log-entry';
                logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
                
                this.battleLog.appendChild(logEntry);
                this.battleLog.scrollTop = this.battleLog.scrollHeight;
            },
            
            // 数组洗牌算法
            shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }
        };

        // 初始化游戏
        game.init();
    </script>
</body>
</html>
