<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高考模拟游戏 - 九科战斗系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #f8f9fa;
            overflow-x: hidden;
        }

        /* 导航栏 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .navbar-content {
            width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #007bff;
            text-decoration: none;
        }

        .nav-menu a {
            margin: 0 12px;
            color: #333;
            text-decoration: none;
            font-size: 16px;
        }

        .nav-menu a:hover {
            color: #007bff;
        }

        /* 返回按钮 */
        .back-btn {
            position: fixed;
            top: 70px;
            left: 20px;
            padding: 8px 16px;
            background: #6c757d;
            color: white;
            border-radius: 4px;
            text-decoration: none;
            font-size: 14px;
            z-index: 100;
        }

        /* 游戏主容器 */
        .game-container {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            z-index: 10;
            overflow-y: auto;
        }

        /* 游戏标题 */
        .game-title {
            font-size: 36px;
            color: #2c3e50;
            margin: 20px 0 20px 0;
            text-align: center;
        }

        /* 选择科目界面 */
        .subject-selection {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin: 20px 0;
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        .section-title {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .section-desc {
            color: #666;
            margin-bottom: 20px;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .subject-btn {
            padding: 20px 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .subject-btn:hover {
            background: #0056b3;
        }

        .subject-btn.selected {
            background: #28a745;
            box-shadow: 0 0 10px rgba(40, 167, 69, 0.5);
        }

        .selected-count {
            margin: 10px 0;
            font-size: 16px;
            color: #666;
        }

        .start-btn {
            padding: 14px 48px;
            font-size: 20px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 20px;
        }

        .start-btn:hover {
            background: #0056b3;
        }

        .start-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        /* 游戏主界面 */
        .game-main {
            display: none;
            width: 100%;
            max-width: 1200px;
        }

        /* 游戏头部信息 */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #007bff;
        }

        .level-info {
            font-size: 24px;
            color: #2c3e50;
            font-weight: bold;
        }

        .player-stats {
            display: flex;
            gap: 20px;
        }

        .stat-box {
            background: white;
            border-radius: 10px;
            padding: 10px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
            min-width: 100px;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
        }

        /* 战斗区域 */
        .battle-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin: 20px 0;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* 九宫格战场 */
        .battlefield {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            width: 400px;
            height: 400px;
            background: #2c3e50;
            border: 3px solid #34495e;
            border-radius: 10px;
            padding: 10px;
        }

        .battle-cell {
            background: #34495e;
            border: 2px solid #4a5f7a;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .battle-cell:hover {
            background: #3d566e;
            border-color: #5d7c9e;
        }

        .battle-cell.occupied {
            background: #2c3e50;
            border-color: #f39c12;
        }

        .unit {
            width: 80%;
            height: 80%;
            background: #e74c3c;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
            position: relative;
        }

        .unit.player {
            background: #3498db;
        }

        .unit.enemy {
            background: #e74c3c;
        }

        /* 单位状态标签 */
        .status-tags {
            position: absolute;
            top: -20px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 2px;
            flex-wrap: wrap;
        }

        .status-tag {
            font-size: 8px;
            padding: 1px 3px;
            border-radius: 3px;
            color: white;
            background: #7f8c8d;
        }

        .status-tag.poison {
            background: #9b59b6;
        }

        .status-tag.silence {
            background: #e67e22;
        }

        .status-tag.stun {
            background: #f1c40f;
        }

        /* 卡牌区域 */
        .card-area {
            flex: 1;
            margin-left: 30px;
        }

        .hand-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .card {
            width: 100px;
            height: 140px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .card.playable {
            cursor: pointer;
        }

        .card.unplayable {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .card-image {
            width: 100%;
            height: 80px;
            background-color: #e67e22;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        .card-name {
            font-size: 12px;
            font-weight: bold;
            color: white;
            margin: 5px 0;
            text-align: center;
        }

        .card-description {
            font-size: 10px;
            color: rgba(255,255,255,0.9);
            padding: 0 5px;
            text-align: center;
            line-height: 1.2;
        }

        .card-cost {
            position: absolute;
            top: 5px;
            right: 5px;
            background: white;
            color: #e67e22;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
        }

        /* 行动点数 */
        .action-points {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .ap-token {
            width: 30px;
            height: 30px;
            background: #3498db;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }

        .ap-token.used {
            background: #95a5a6;
        }

        /* 战斗控制 */
        .battle-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }

        .battle-btn {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
        }

        .battle-btn:hover {
            background: #0056b3;
        }

        .battle-btn.end-turn {
            background: #28a745;
        }

        .battle-btn.end-turn:hover {
            background: #218838;
        }

        /* 日志区域 */
        .log-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .log-title {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .log-content {
            color: #666;
            line-height: 1.6;
            font-size: 14px;
        }

        .log-entry {
            margin-bottom: 5px;
            padding-left: 15px;
            border-left: 3px solid #007bff;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .battle-area {
                flex-direction: column;
                align-items: center;
            }
            
            .battlefield {
                width: 300px;
                height: 300px;
            }
            
            .card-area {
                margin-left: 0;
                margin-top: 20px;
            }
            
            .game-header {
                flex-direction: column;
                gap: 15px;
            }
            
            .player-stats {
                width: 100%;
                justify-content: space-around;
            }
        }
    </style>
</head>

                </div>

                <!-- 卡牌区域 -->
                <div class="card-area">
                    <!-- 行动点数 -->
                    <div class="action-points" id="actionPoints">

                    <!-- 手牌 -->
                    <div class="hand-container" id="handContainer">
                        <!-- 手牌将在JavaScript中动态生成 -->

                    <!-- 战斗控制 -->

            </div>

            },
            
            // 初始化游戏
            init() {
                // 绑定科目选择事件
                this.subjectBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const subject = e.target.getAttribute('data-subject');
                        const isSelected = e.target.classList.contains('selected');
                        
                        if (isSelected) {
                            // 取消选择
                            e.target.classList.remove('selected');
                            this.selectedSubjects = this.selectedSubjects.filter(s => s !== subject);
                        } else {
                            // 选择科目（最多6门）
                            if (this.selectedSubjects.length < 6) {
                                e.target.classList.add('selected');
                                this.selectedSubjects.push(subject);
                            } else {
                                alert('只能选择6门科目！');
                                return;
                            }
                        }
                        
                        // 更新计数显示
                        this.updateSelectedCount();
                        
                        // 检查是否满足开始条件
                        this.checkStartCondition();
                    });
                });
                
                // 绑定开始游戏事件
                this.startBtn.addEventListener('click', () => {
                    this.startGame();
                });
                
                // 绑定回合控制事件
                this.endTurnBtn.addEventListener('click', () => {
                    this.endTurn();
                });
                
                this.skipBtn.addEventListener('click', () => {
                    this.skipTurn();
                });
            },
            
            // 更新选中计数显示
            updateSelectedCount() {
                this.selectedCount.textContent = `已选择 ${this.selectedSubjects.length}/6 门科目`;
            },
            
            // 检查开始条件
            checkStartCondition() {
                if (this.selectedSubjects.length === 6) {
                    this.startBtn.disabled = false;
                } else {
                    this.startBtn.disabled = true;
                }
            },
            
            // 开始游戏
            startGame() {
                // 隐藏选择界面，显示游戏主界面
                this.subjectSelection.style.display = 'none';
                this.gameMain.style.display = 'block';
                
                // 初始化游戏状态
                this.initializeGameState();
                
                // 生成战场
                this.createBattlefield();
                
                // 开始游戏循环
                this.startGameLoop();
                
                // 添加开始游戏的日志
                this.addLogEntry(`战斗开始！选择的科目：${this.selectedSubjects.join(', ')}`);
            },
            
            // 初始化游戏状态
            initializeGameState() {
                // 初始化卡组
                this.gameState.deck = [];
                this.selectedSubjects.forEach(subject => {
                    this.gameState.deck = this.gameState.deck.concat(this.subjectCards[subject]);
                });
                
                // 洗牌
                this.shuffleArray(this.gameState.deck);
                
                // 抽初始手牌（3张）
                for (let i = 0; i < 3; i++) {
                    if (this.gameState.deck.length > 0) {
                        this.gameState.hand.push(this.gameState.deck.pop());
                    }
                }
                
                // 初始化战场
                this.gameState.battlefield = Array(9).fill(null);
                
                // 设置初始单位
                this.spawnInitialUnits();
                
                // 更新显示
                this.updateDisplay();
            },
            
            // 生成战场格子
            createBattlefield() {
                this.battlefield.innerHTML = '';
                
                for (let i = 0; i < 9; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'battle-cell';
                    cell.dataset.index = i;
                    
                    cell.addEventListener('click', (e) => {
                        this.selectCell(i);
                    });
                    
                    this.battlefield.appendChild(cell);
                }
            },
            
            // 生成初始单位
            spawnInitialUnits() {
                // 玩家主将（左下角）
                const playerUnit = {
                    id: 'player_main',
                    type: 'player',
                    health: 20,
                    maxHealth: 20,
                    attack: 3,
                    position: 6, // 左下角
                    subject: '通用',
                    statuses: []
                };
                
                // 敌方主将（右上角）
                const enemyUnit = {
                    id: 'enemy_main',
                    type: 'enemy',
                    health: 20,
                    maxHealth: 20,
                    attack: 3,
                    position: 2, // 右上角
                    subject: '通用',
                    statuses: []
                };
                
                // 添加到战场
                this.gameState.battlefield[6] = playerUnit;
                this.gameState.battlefield[2] = enemyUnit;
                
                this.gameState.playerUnits.push(playerUnit);
                this.gameState.enemyUnits.push(enemyUnit);
            },
            
            // 选择战场格子
            selectCell(index) {
                if (this.gameState.turnPhase !== 'action') return;
                
                const cell = this.battlefield.children[index];
                const unit = this.gameState.battlefield[index];
                
                // 如果点击了有单位的格子，显示单位信息
                if (unit) {
                    this.addLogEntry(`${unit.type === 'player' ? '我方' : '敌方'}单位：${unit.subject} - ${unit.health}/${unit.maxHealth} HP`);
                }
                
                this.gameState.selectedCell = index;
            },
            
            // 开始游戏循环
            startGameLoop() {
                // 这里可以添加游戏主循环逻辑
                this.updateBattlefieldDisplay();
                this.renderHand();
                this.renderActionPoints();
            },
            
            // 更新战场显示
            updateBattlefieldDisplay() {
                for (let i = 0; i < 9; i++) {
                    const cell = this.battlefield.children[i];
                    const unit = this.gameState.battlefield[i];
                    
                    cell.innerHTML = '';
                    cell.classList.remove('occupied');
                    
                    if (unit) {
                        cell.classList.add('occupied');
                        
                        const unitDiv = document.createElement('div');
                        unitDiv.className = `unit ${unit.type}`;
                        unitDiv.innerHTML = `
                            <div class="status-tags">
                                ${this.renderStatusTags(unit.statuses)}
                            </div>
                            <div>${unit.subject}<br>${unit.health}/${unit.maxHealth}</div>
                        `;
                        
                        cell.appendChild(unitDiv);
                    }
                }
            },
            
            // 渲染状态标签
            renderStatusTags(statuses) {
                if (!statuses || statuses.length === 0) return '';
                
                return statuses.map(status => {
                    const className = status.type.toLowerCase();
                    return `<span class="status-tag ${className}">${status.type}</span>`;
                }).join('');
            },
            
            // 渲染手牌
            renderHand() {
                this.handContainer.innerHTML = '';
                
                this.gameState.hand.forEach((card, index) => {
                    const cardDiv = document.createElement('div');
                    cardDiv.className = `card ${card.cost <= this.gameState.currentPlayerAP ? 'playable' : 'unplayable'}`;
                    cardDiv.innerHTML = `
                        <div class="card-image">${card.icon}</div>
                        <div class="card-name">${card.name}</div>
                        <div class="card-description">${card.description.replace('\n', '<br>')}</div>
                        <div class="card-cost">${card.cost}</div>
                    `;
                    
                    if (card.cost <= this.gameState.currentPlayerAP) {
                        cardDiv.addEventListener('click', () => {
                            this.playCard(index);
                        });
                    }
                    
                    this.handContainer.appendChild(cardDiv);
                });
            },
            
            // 渲染行动点数
            renderActionPoints() {
                this.actionPoints.innerHTML = '';
                
                for (let i = 0; i < this.gameState.maxAP; i++) {
                    const apToken = document.createElement('div');
                    apToken.className = `ap-token ${i < this.gameState.currentPlayerAP ? '' : 'used'}`;
                    apToken.textContent = 'AP';
                    this.actionPoints.appendChild(apToken);
                }
            },
            
            // 打出卡牌
            playCard(handIndex) {
                if (this.gameState.turnPhase !== 'action') return;
                
                const card = this.gameState.hand[handIndex];
                
                if (card.cost > this.gameState.currentPlayerAP) {
                    this.addLogEntry(`❌ 行动点数不足，无法使用 ${card.name}！`);
                    return;
                }
                
                // 消耗行动点数
                this.gameState.currentPlayerAP -= card.cost;
                
                // 执行卡牌效果
                this.executeCardEffect(card);
                
                // 从手牌移除
                this.gameState.hand.splice(handIndex, 1);
                
                // 抽新卡
                if (this.gameState.deck.length > 0) {
                    this.gameState.hand.push(this.gameState.deck.pop());
                }
                
                // 更新显示
                this.updateDisplay();
                
                this.addLogEntry(`✅ 使用了 ${card.name}！`);
            },
            
            // 执行卡牌效果
            executeCardEffect(card) {
                switch(card.effect) {
                    case 'gain_wensi':
                        // 获得文思
                        this.addLogEntry(`📖 获得了 ${card.value} 层文思！`);
                        break;
                    case 'poetry_choice':
                        // 诗词默写抉择效果
                        this.addLogEntry(`✍️ 诗词默写：造成 ${card.value} 伤害或回复 ${card.value} 生命`);
                        // 这里可以添加抉择界面
                        break;
                    case 'silence_enemy':
                        // 沉默敌人
                        this.addLogEntry(`🤐 对敌人施加沉默效果 ${card.duration} 回合！`);
                        break;
                    case 'true_damage':
                        // 真实伤害
                        this.addLogEntry(`🎯 造成 ${card.value} 点真实伤害！`);
                        break;
                    case 'gain_zhengming':
                        // 获得证明
                        this.addLogEntry(`🧮 获得了 ${card.value} 层证明！`);
                        break;
                    default:
                        this.addLogEntry(`⚡ 触发了 ${card.name} 的特殊效果！`);
                }
            },
            
            // 结束回合
            endTurn() {
                this.addLogEntry(`🔚 结束第 ${this.gameState.currentTurn} 回合`);
                
                // 回合结束处理
                this.processEndOfTurn();
                
                // 进入敌方回合（简化版）
                this.enemyTurn();
                
                // 开始新回合
                this.startNewTurn();
            },
            
            // 跳过回合
            skipTurn() {
                this.addLogEntry(`⏭️ 跳过了当前回合`);
                this.endTurn();
            },
            
            // 回合结束处理
            processEndOfTurn() {
                // 处理持续效果
                this.handleTurnEndEffects();
                
                // 恢复行动点数
                this.gameState.currentPlayerAP = this.gameState.maxAP;
            },
            
            // 处理回合结束效果
            handleTurnEndEffects() {
                // 检查战场上的单位状态
                for (let i = 0; i < this.gameState.battlefield.length; i++) {
                    const unit = this.gameState.battlefield[i];
                    if (unit) {
                        // 处理持续伤害状态（如灼烧、中毒等）
                        const damageOverTime = unit.statuses.filter(status => status.dot);
                        damageOverTime.forEach(status => {
                            unit.health -= status.dot;
                            this.addLogEntry(`${unit.type === 'player' ? '我方' : '敌方'}单位受到 ${status.dot} 点持续伤害！`);
                            
                            if (unit.health <= 0) {
                                this.removeUnit(i);
                            }
                        });
                        
                        // 更新状态持续回合
                        unit.statuses = unit.statuses.map(status => {
                            if (status.duration) {
                                status.duration--;
                                if (status.duration <= 0) {
                                    this.addLogEntry(`${status.type} 状态消失！`);
                                    return null;
                                }
                            }
                            return status;
                        }).filter(Boolean);
                    }
                }
            },
            
            // 敌方回合（简化版）
            enemyTurn() {
                // 简单的AI逻辑：随机攻击玩家单位
                const enemyUnits = this.gameState.enemyUnits;
                const playerUnits = this.gameState.playerUnits;
                
                if (enemyUnits.length > 0 && playerUnits.length > 0) {
                    const attacker = enemyUnits[Math.floor(Math.random() * enemyUnits.length)];
                    const target = playerUnits[Math.floor(Math.random() * playerUnits.length)];
                    
                    // 简单攻击逻辑
                    target.health -= attacker.attack;
                    this.addLogEntry(`⚔️ 敌方 ${attacker.subject} 攻击了我方 ${target.subject}，造成 ${attacker.attack} 点伤害！`);
                    
                    if (target.health <= 0) {
                        // 移除死亡单位
                        const pos = this.findUnitPosition(target.id);
                        if (pos !== -1) {
                            this.removeUnit(pos);
                        }
                    }
                }
            },
            
            // 开始新回合
            startNewTurn() {
                this.gameState.currentTurn++;
                
                // 抽卡（每回合抽1张）
                if (this.gameState.deck.length > 0) {
                    this.gameState.hand.push(this.gameState.deck.pop());
                }
                
                // 恢复行动点数
                this.gameState.currentPlayerAP = this.gameState.maxAP;
                
                // 更新显示
                this.updateDisplay();
                
                this.addLogEntry(`🔄 进入第 ${this.gameState.currentTurn} 回合`);
            },
            
            // 移除单位
            removeUnit(position) {
                const unit = this.gameState.battlefield[position];
                if (!unit) return;
                
                // 从对应列表中移除
                if (unit.type === 'player') {
                    this.gameState.playerUnits = this.gameState.playerUnits.filter(u => u.id !== unit.id);
                } else {
                    this.gameState.enemyUnits = this.gameState.enemyUnits.filter(u => u.id !== unit.id);
                }
                
                // 从战场移除
                this.gameState.battlefield[position] = null;
                
                this.addLogEntry(`${unit.type === 'player' ? '我方' : '敌方'} ${unit.subject} 单位被消灭！`);
            },
            
            // 查找单位位置
            findUnitPosition(unitId) {
                for (let i = 0; i < this.gameState.battlefield.length; i++) {
                    if (this.gameState.battlefield[i] && this.gameState.battlefield[i].id === unitId) {
                        return i;
                    }
                }
                return -1;
            },
            
            // 更新显示
            updateDisplay() {
                this.currentLevel.textContent = `第 ${this.gameState.currentTurn} 回合`;
                this.playerScore.textContent = this.gameState.score;
                this.playerKnowledge.textContent = this.gameState.knowledge;
                this.playerFocus.textContent = this.gameState.focus;
                this.currentSubject.textContent = this.gameState.currentSubject;
                this.currentTurn.textContent = this.gameState.currentTurn;
                
                this.updateBattlefieldDisplay();
                this.renderHand();
                this.renderActionPoints();
            },
            
            // 添加日志条目
            addLogEntry(text) {
                const logEntry = document.createElement('div');
                logEntry.className = 'log-entry';
                logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
                
                this.battleLog.appendChild(logEntry);
                this.battleLog.scrollTop = this.battleLog.scrollHeight;
            },
            
            // 数组洗牌算法
            shuffleArray(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }
        };

        // 初始化游戏
        game.init();
    </script>
