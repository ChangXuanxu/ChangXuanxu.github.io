<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学科对战游戏 - 士多啤梨除草机</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            background-color: #f8f9fa;
            overflow-x: hidden;
        }

        /* 导航栏 - 保持风格统一 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .navbar-content {
            width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #007bff;
            text-decoration: none;
        }

        .nav-menu a {
            margin: 0 12px;
            color: #333;
            text-decoration: none;
            font-size: 16px;
        }

        .nav-menu a:hover {
            color: #007bff;
        }

        /* 返回按钮 */
        .back-btn {
            position: fixed;
            top: 70px;
            left: 20px;
            padding: 8px 16px;
            background: #6c757d;
            color: white;
            border-radius: 4px;
            text-decoration: none;
            font-size: 14px;
            z-index: 100;
        }

        /* 游戏主容器 */
        .game-container {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            z-index: 10;
            overflow-y: auto;
        }

        /* 游戏标题 */
        .game-title {
            font-size: 36px;
            color: #2c3e50;
            margin: 20px 0 20px 0;
            text-align: center;
        }

        /* 选择学科区域 */
        .subject-selection {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin: 20px 0;
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        .subject-title {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .subject-btn {
            padding: 20px 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .subject-btn:hover {
            background: #0056b3;
        }

        .subject-btn.selected {
            background: #28a745;
            box-shadow: 0 0 10px rgba(40, 167, 69, 0.5);
        }

        .start-btn {
            padding: 14px 48px;
            font-size: 20px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 20px;
        }

        .start-btn:hover {
            background: #0056b3;
        }

        .start-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }

        /* 游戏主界面 */
        .game-main {
            display: none;
            width: 100%;
            max-width: 1200px;
        }

        /* 游戏头部信息 */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #007bff;
        }

        .level-info {
            font-size: 24px;
            color: #2c3e50;
            font-weight: bold;
        }

        .player-stats {
            display: flex;
            gap: 20px;
        }

        .stat-box {
            background: white;
            border-radius: 10px;
            padding: 10px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
            min-width: 100px;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
        }

        /* 战斗区域 */
        .battle-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .enemy-container {
            text-align: center;
            flex: 1;
        }

        .enemy-card {
            width: 200px;
            height: 300px;
            margin: 0 auto;
            background: linear-gradient(135deg, #3498db, #2c3e50);
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: transform 0.3s;
        }

        .enemy-card:hover {
            transform: scale(1.05);
        }

        .enemy-image {
            width: 100%;
            height: 100%;
            background-color: #2c3e50;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 36px;
            font-weight: bold;
        }

        .enemy-info {
            margin-top: 20px;
        }

        .enemy-name {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .enemy-health {
            font-size: 20px;
            color: #e74c3c;
            font-weight: bold;
        }

        /* 卡牌区域 */
        .card-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .card {
            width: 150px;
            height: 220px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 12px 25px rgba(0,0,0,0.2);
        }

        .card-image {
            width: 100%;
            height: 140px;
            background-color: #e67e22;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 36px;
            font-weight: bold;
        }

        .card-name {
            font-size: 18px;
            font-weight: bold;
            color: white;
            margin: 10px 0;
        }

        .card-description {
            font-size: 12px;
            color: rgba(255,255,255,0.9);
            padding: 0 10px;
            text-align: center;
            line-height: 1.4;
        }

        .card-cost {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            color: #e67e22;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
        }

        /* 日志区域 */
        .log-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .log-title {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .log-content {
            color: #666;
            line-height: 1.6;
            font-size: 14px;
        }

        .log-entry {
            margin-bottom: 5px;
            padding-left: 15px;
            border-left: 3px solid #007bff;
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            .battle-area {
                flex-direction: column;
                gap: 40px;
            }
            
            .subject-grid {
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            }
            
            .card-container {
                flex-direction: column;
                align-items: center;
            }
            
            .game-header {
                flex-direction: column;
                gap: 15px;
            }
            
            .player-stats {
                width: 100%;
                justify-content: space-around;
            }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="navbar-content">
            <a href="index.html" class="logo">士多啤梨除草机</a>
            <div class="nav-menu">
                <a href="index.html">首页</a>
                <a href="fun-tools.html">趣味组件</a>
                <a href="blog.html">个人博客</a>
                <a href="games.html">小游戏</a>
                <a href="#">联系我</a>
            </div>
        </div>
    </nav>

    <!-- 返回按钮 -->
    <a href="games.html" class="back-btn">← 返回小游戏合集</a>

    <!-- 游戏容器 -->
    <div class="game-container">
        <h1 class="game-title">学科对战游戏</h1>

        <!-- 选择学科界面 -->
        <div class="subject-selection" id="subjectSelection">
            <h2 class="subject-title">选择你的学科领域</h2>
            <p>选择一个学科开始挑战，用知识击败敌人！</p>
            
            <div class="subject-grid">
                <button class="subject-btn" data-subject="物理">📚<br>物理</button>
                <button class="subject-btn" data-subject="化学">🧪<br>化学</button>
                <button class="subject-btn" data-subject="生物">🧬<br>生物</button>
                <button class="subject-btn" data-subject="历史">📜<br>历史</button>
                <button class="subject-btn" data-subject="地理">🌍<br>地理</button>
                <button class="subject-btn" data-subject="政治">⚖️<br>政治</button>
            </div>
            
            <button class="start-btn" id="start-game" disabled>开始闯关</button>
        </div>

        <!-- 游戏主界面 -->
        <div class="game-main" id="gameMain">
            <!-- 游戏头部信息 -->
            <div class="game-header">
                <div class="level-info" id="currentLevel">第 1 关</div>
                <div class="player-stats">
                    <div class="stat-box">
                        <div class="stat-label">生命值</div>
                        <div class="stat-value" id="playerHealth">100</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">能量值</div>
                        <div class="stat-value" id="playerEnergy">50</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">得分</div>
                        <div class="stat-value" id="playerScore">0</div>
                    </div>
                </div>
            </div>

            <!-- 战斗区域 -->
            <div class="battle-area">
                <div class="enemy-container">
                    <div class="enemy-card">
                        <div class="enemy-image" id="enemy-image">?</div>
                    </div>
                    <div class="enemy-info">
                        <div class="enemy-name" id="enemy-name">未知敌人</div>
                        <div class="enemy-health" id="enemy-health">HP: 100</div>
                    </div>
                </div>

                <div class="card-area">
                    <div class="card-container" id="card-container">
                        <!-- 卡牌将在这里动态生成 -->
                    </div>
                </div>
            </div>

            <!-- 战斗日志 -->
            <div class="log-container">
                <div class="log-title">战斗日志</div>
                <div class="log-content" id="battle-log">
                    <div class="log-entry">游戏开始！选择你的科目吧！</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 游戏核心对象
        const game = {
            // DOM元素
            subjectSelection: document.getElementById('subjectSelection'),
            gameMain: document.getElementById('gameMain'),
            startBtn: document.getElementById('start-game'),
            subjectBtns: document.querySelectorAll('.subject-btn'),
            currentLevel: document.getElementById('currentLevel'),
            playerHealth: document.getElementById('playerHealth'),
            playerEnergy: document.getElementById('playerEnergy'),
            playerScore: document.getElementById('playerScore'),
            enemyImage: document.getElementById('enemy-image'),
            enemyName: document.getElementById('enemy-name'),
            enemyHealth: document.getElementById('enemy-health'),
            cardContainer: document.getElementById('card-container'),
            battleLog: document.getElementById('battle-log'),
            
            // 游戏状态
            selectedSubject: null,
            gameState: {
                level: 1,
                playerHealth: 100,
                playerEnergy: 50,
                playerScore: 0,
                enemyHealth: 100
            },
            
            // 学科卡牌数据
            subjectCards: {
                物理: [
                    { name: "牛顿定律", description: "经典力学基础", cost: 10, damage: 15, icon: "⚡" },
                    { name: "量子理论", description: "微观世界奥秘", cost: 20, damage: 25, icon: "⚛️" },
                    { name: "相对论", description: "时空弯曲", cost: 30, damage: 35, icon: "🌌" }
                ],
                化学: [
                    { name: "化学键", description: "分子结合力", cost: 10, damage: 15, icon: "🧪" },
                    { name: "氧化还原", description: "电子转移反应", cost: 20, damage: 25, icon: "🔥" },
                    { name: "有机合成", description: "碳化合物构建", cost: 30, damage: 35, icon: "🧬" }
                ],
                生物: [
                    { name: "细胞分裂", description: "生命基础", cost: 10, damage: 15, icon: "🦠" },
                    { name: "DNA复制", description: "遗传信息传递", cost: 20, damage: 25, icon: "🧬" },
                    { name: "进化论", description: "物种演化", cost: 30, damage: 35, icon: "🌿" }
                ],
                历史: [
                    { name: "古代文明", description: "人类起源", cost: 10, damage: 15, icon: "🏛️" },
                    { name: "革命浪潮", description: "社会变革", cost: 20, damage: 25, icon: "⚔️" },
                    { name: "工业革命", description: "时代转折", cost: 30, damage: 35, icon: "🏭" }
                ],
                地理: [
                    { name: "地形地貌", description: "地球表面", cost: 10, damage: 15, icon: "🏔️" },
                    { name: "气候系统", description: "大气循环", cost: 20, damage: 25, icon: "🌪️" },
                    { name: "板块构造", description: "地壳运动", cost: 30, damage: 35, icon: "🌋" }
                ],
                政治: [
                    { name: "民主制度", description: "人民主权", cost: 10, damage: 15, icon: "🗳️" },
                    { name: "国际关系", description: "外交博弈", cost: 20, damage: 25, icon: "🌍" },
                    { name: "法律体系", description: "社会秩序", cost: 30, damage: 35, icon: "⚖️" }
                ]
            },
            
            // 敌人数据
            enemies: [
                { name: "学术挑战者", health: 50, image: "🎓", difficulty: 1 },
                { name: "知识守护者", health: 75, image: "📚", difficulty: 2 },
                { name: "智慧巨龙", health: 100, image: "🐉", difficulty: 3 },
                { name: "真理审判者", health: 125, image: "🔍", difficulty: 4 },
                { name: "终极智者", health: 150, image: "🌟", difficulty: 5 }
            ],
            
            // 初始化游戏
            init() {
                // 绑定学科选择事件
                this.subjectBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const subject = e.target.getAttribute('data-subject');
                        
                        // 移除所有选中状态
                        this.subjectBtns.forEach(b => b.classList.remove('selected'));
                        
                        // 添加选中状态
                        e.target.classList.add('selected');
                        
                        // 设置选中的学科
                        this.selectedSubject = subject;
                        
                        // 启用开始按钮
                        this.startBtn.disabled = false;
                    });
                });
                
                // 绑定开始游戏事件
                this.startBtn.addEventListener('click', () => {
                    this.startGame();
                });
            },
            
            // 开始游戏
            startGame() {
                // 隐藏选择界面，显示游戏主界面
                this.subjectSelection.style.display = 'none';
                this.gameMain.style.display = 'block';
                
                // 初始化游戏状态
                this.gameState = {
                    level: 1,
                    playerHealth: 100,
                    playerEnergy: 50,
                    playerScore: 0,
                    enemyHealth: 100
                };
                
                // 显示初始信息
                this.updateDisplay();
                
                // 生成敌人
                this.generateEnemy();
                
                // 生成卡牌
                this.generateCards();
                
                // 添加开始游戏的日志
                this.addLogEntry(`选择了 ${this.selectedSubject} 学科，开始挑战！`);
            },
            
            // 生成敌人
            generateEnemy() {
                const enemyIndex = Math.min(this.gameState.level - 1, this.enemies.length - 1);
                const enemy = this.enemies[enemyIndex];
                
                this.enemyImage.textContent = enemy.image;
                this.enemyName.textContent = enemy.name;
                this.enemyHealth.textContent = `HP: ${enemy.health}`;
                
                // 更新游戏状态中的敌人血量
                this.gameState.enemyHealth = enemy.health;
                
                this.addLogEntry(`遭遇敌人：${enemy.name}`);
            },
            
            // 生成卡牌
            generateCards() {
                this.cardContainer.innerHTML = '';
                
                const cards = this.subjectCards[this.selectedSubject] || [];
                
                cards.forEach(card => {
                    const cardElement = document.createElement('div');
                    cardElement.className = 'card';
                    cardElement.innerHTML = `
                        <div class="card-image">${card.icon}</div>
                        <div class="card-name">${card.name}</div>
                        <div class="card-description">${card.description}</div>
                        <div class="card-cost">${card.cost}</div>
                    `;
                    
                    cardElement.addEventListener('click', () => {
                        this.useCard(card);
                    });
                    
                    this.cardContainer.appendChild(cardElement);
                });
            },
            
            // 使用卡牌
            useCard(card) {
                if (this.gameState.playerEnergy < card.cost) {
                    this.addLogEntry(`能量不足，无法使用 ${card.name}！`);
                    return;
                }
                
                // 扣除能量
                this.gameState.playerEnergy -= card.cost;
                
                // 对敌人造成伤害
                this.gameState.enemyHealth -= card.damage;
                if (this.gameState.enemyHealth < 0) this.gameState.enemyHealth = 0;
                
                // 增加分数
                this.gameState.playerScore += card.damage;
                
                // 更新显示
                this.updateDisplay();
                
                // 添加日志
                this.addLogEntry(`使用 ${card.name} 对敌人造成 ${card.damage} 点伤害！`);
                
                // 检查敌人是否被击败
                if (this.gameState.enemyHealth <= 0) {
                    this.defeatEnemy();
                } else {
                    // 敌人反击
                    this.enemyAttack();
                }
            },
            
            // 敌人攻击
            enemyAttack() {
                // 简单的敌人攻击逻辑
                const damage = Math.floor(Math.random() * 10) + 5;
                this.gameState.playerHealth -= damage;
                
                if (this.gameState.playerHealth < 0) this.gameState.playerHealth = 0;
                
                this.updateDisplay();
                this.addLogEntry(`敌人攻击！你受到了 ${damage} 点伤害！`);
                
                // 检查玩家是否被击败
                if (this.gameState.playerHealth <= 0) {
                    this.gameOver();
                }
            },
            
            // 击败敌人
            defeatEnemy() {
                this.addLogEntry(`🎉 恭喜击败敌人！获得奖励！`);
                
                // 增加能量回复
                this.gameState.playerEnergy = Math.min(100, this.gameState.playerEnergy + 20);
                
                // 进入下一关
                this.nextLevel();
            },
            
            // 下一关
            nextLevel() {
                this.gameState.level++;
                
                // 回复部分生命值
                this.gameState.playerHealth = Math.min(100, this.gameState.playerHealth + 20);
                
                this.updateDisplay();
                
                setTimeout(() => {
                    this.generateEnemy();
                    this.generateCards();
                    this.addLogEntry(`进入第 ${this.gameState.level} 关！`);
                }, 1500);
            },
            
            // 游戏结束
            gameOver() {
                this.addLogEntry(`💀 游戏结束！最终得分：${this.gameState.playerScore}`);
                
                // 重新开始按钮
                setTimeout(() => {
                    if (confirm('游戏结束！是否重新开始？')) {
                        this.restartGame();
                    }
                }, 2000);
            },
            
            // 重新开始游戏
            restartGame() {
                this.gameMain.style.display = 'none';
                this.subjectSelection.style.display = 'block';
                
                // 重置选中状态
                this.subjectBtns.forEach(b => b.classList.remove('selected'));
                this.selectedSubject = null;
                this.startBtn.disabled = true;
            },
            
            // 更新显示
            updateDisplay() {
                this.currentLevel.textContent = `第 ${this.gameState.level} 关`;
                this.playerHealth.textContent = this.gameState.playerHealth;
                this.playerEnergy.textContent = this.gameState.playerEnergy;
                this.playerScore.textContent = this.gameState.playerScore;
                this.enemyHealth.textContent = `HP: ${this.gameState.enemyHealth}`;
            },
            
            // 添加日志条目
            addLogEntry(text) {
                const logEntry = document.createElement('div');
                logEntry.className = 'log-entry';
                logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
                
                this.battleLog.appendChild(logEntry);
                this.battleLog.scrollTop = this.battleLog.scrollHeight;
            }
        };

        // 初始化游戏
        game.init();
    </script>
</body>
</html>
