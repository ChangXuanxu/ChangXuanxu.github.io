            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .navbar-content {
            width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #007bff;
            text-decoration: none;
        }

        .nav-menu a {
            margin: 0 12px;
            color: #333;
            text-decoration: none;
            font-size: 16px;
            transition: color 0.2s;
        }

        .nav-menu a:hover {
            color: #007bff;
        }

        /* 返回按钮 */
        .back-btn {
            position: fixed;
            top: 70px;
            left: 20px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.15);
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            z-index: 100;
            backdrop-filter: blur(10px);
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.25);
        }

        /* 主容器 */
        .main-container {
            max-width: 800px;
            margin: 100px auto 40px;
            padding: 0 20px;
        }

        /* 标题 */
        .game-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .game-title h1 {
            font-size: 42px;
            background: linear-gradient(135deg, #f093fb, #f5576c, #fda085);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .game-title p {
            color: #aaa;
            font-size: 16px;
        }

        /* 模式切换标签 */
        .mode-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 24px;
            background: rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 4px;
            backdrop-filter: blur(10px);
        }

        .mode-tab {
            flex: 1;
            padding: 14px 20px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s ease;
            color: #aaa;
            border: none;
            background: transparent;
        }

        .mode-tab.active.truth {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            box-shadow: 0 4px 15px rgba(102,126,234,0.4);
        }

        .mode-tab.active.dare {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: #fff;
            box-shadow: 0 4px 15px rgba(245,87,108,0.4);
        }

        .mode-tab .icon {
            font-size: 24px;
            display: block;
            margin-bottom: 4px;
        }

        /* 类别选择区 */
        .category-section {
            margin-bottom: 20px;
        }

        .category-label {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-label .all-btn {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.2);
            background: transparent;
            color: #aaa;
            transition: all 0.2s;
        }

        .category-label .all-btn:hover,
        .category-label .all-btn.active {
            background: rgba(255,255,255,0.15);
            color: #fff;
            border-color: rgba(255,255,255,0.4);
        }

        .category-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .category-chip {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: #ccc;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .category-chip:hover {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.3);
        }

        .category-chip.active.truth-chip {
            background: rgba(102,126,234,0.3);
            border-color: #667eea;
            color: #fff;
        }

        .category-chip.active.dare-chip {
            background: rgba(245,87,108,0.3);
            border-color: #f5576c;
            color: #fff;
        }

        .category-chip .count {
            font-size: 11px;
            opacity: 0.6;
            margin-left: 4px;
        }

        /* 抽取按钮 */
        .draw-section {
            text-align: center;
            margin: 30px 0;
        }

        .draw-btn {
            padding: 18px 60px;
            font-size: 22px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            color: #fff;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            letter-spacing: 2px;
        }

        .draw-btn.truth-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            box-shadow: 0 6px 25px rgba(102,126,234,0.4);
        }

        .draw-btn.dare-btn {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            box-shadow: 0 6px 25px rgba(245,87,108,0.4);
        }

        .draw-btn:hover {
            transform: translateY(-2px);
        }

        .draw-btn:active {
            transform: scale(0.96);
        }

        .draw-btn.spinning {
            animation: pulse 0.5s ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* 结果卡片 */
        .result-card {
            background: rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
            margin-top: 10px;
        }

        .result-card.empty {
            color: #666;
            font-size: 18px;
        }

        .result-card.filled {
            animation: cardReveal 0.6s ease-out;
        }

        @keyframes cardReveal {
            0% {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .result-content {
            width: 100%;
        }

        .result-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;

        .result-badge.truth-badge {
            background: rgba(102,126,234,0.3);
            color: #b8c4ff;
        }

        .result-badge.dare-badge {
            background: rgba(245,87,108,0.3);
            color: #ffb8c4;
        }

        .result-text {
            font-size: 24px;
            line-height: 1.6;
            color: #fff;
            margin-bottom: 8px;
        }

        .result-category {
            font-size: 13px;
            color: #888;
            margin-top: 10px;

            margin-top: 16px;
            padding: 10px 24px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: #ccc;
            transition: all 0.2s;

            background: rgba(255,255,255,0.2);

            color: #666;
            font-size: 13px;
            margin-top: 20px;

                padding: 12px 14px;
            }

            }

                font-size: 18px;
            }

            .result-text {

            }

            .result-card {
                padding: 25px 20px;
            }

            .category-chips {
                gap: 6px;
            }

            .category-chip {
                padding: 6px 12px;
                font-size: 12px;
            }

            .back-btn {
                top: auto;
                bottom: 20px;
                left: 20px;
            }
        }
    </style>
</head>

            "把手纸当围巾围在脖子上持续一轮。",
            "任选两个男生一起摆芙蓉姐姐S形。",
            "男生摸自己胸说"唉，太小了"。",
            "慢慢地、性感地把上衣撩起到不能再撩，并柔声说"我好寂寞啊"。",
            "喝一小口泡菜汁、醋或由小组指定的奇怪液体。",
            "情景剧表演："锄禾日当午"桥段（一男一女）。",
            "一人用嘴吸住纸牌，另一人用嘴从另一面吸住移走。",
            "让右边的人用发胶给你设计一个新发型。",
            "给别人任意涂指甲油。",
            "吃一勺由大家投票选出的最黑暗料理组合。"
        ],
        "有趣搞笑向": [
            "打电话给最近的披萨店，认真地问他们卖不卖墨西哥卷饼。",
            "在别人的"为你推荐"页面尝试跳第一个舞蹈动作。",
            "接下来15分钟只能用第三人称称呼自己。",
            "用你最浮夸的方式表演你早晨起床的全过程。",
            "让大家给你指定一个奇怪的走路姿势，保持到下一轮。",
            "用Rap的方式介绍今天的天气状况。",
            "假装你是一个正在直播的带货主播，推销你脚上的袜子。",
            "用TVB配音腔朗读一段食品包装上的配料表。",
            "表演"第一次见到雪/见到海"的夸张反应。",
            "假装手机响了，接起来进行一段完全虚构的1分钟对话。",
            "用最慢的慢动作表演你打喷嚏的全过程。",
            "把在场某个人的名字编成一首五言绝句念出来。",
            "模仿抖音/快手上最火的一个梗/动作。",
            ""不小心"把一杯水打翻，然后用最浮夸的方式收拾。",
            "给在场的每个人起一个江湖外号，并解释为什么。"
        ],
        "大胆成年人向": [
            "与右侧的玩家交换一件衣服。",
            "在其他人试图用谈话分散你注意力的情况下，保持平板支撑1分钟。",
            "真诚地赞美房间里某人的外貌/身材（必须具体）。",
            "现在就做20个俯卧撑（做不了就脱一件外套）。",
            "为房间里的某人演唱一首浪漫歌曲，必须深情对视。",
            "分享一张你手机里最不想让人看到的照片。",
            "让群组成员阅读你最近的一段聊天记录（你可以屏蔽一个人）。",
            "给你的前任发一条"最近还好吗"，展示回复。",
            "和对面的人用嘴撕一张纸，直到撕到不能再小。",
            "选择一个人，在他/她耳边用气声说一句让对方脸红的话。",
            "讲一个"未成年人不宜"的段子（视气氛而定）。",
            "详细描述你最糟糕的一次约会/恋爱糗事，有劲爆细节但不说名字。",
            "公开你最近一次买的、你觉得丢人或没用的东西。",
            "让某人用眼罩/布蒙住你的眼睛，猜谁碰了你的哪个部位。",
            "跪地对在场某人进行30秒的"求婚演练"。"
        ]
    };

    // ==================== 游戏状态 ====================
    let currentMode = 'truth';  // 'truth' | 'dare'
    let selectedCategory = null;  // null means all categories

    // ==================== 初始化 ====================
    function init() {
        renderCategoryChips();
        updateStats();
    }

    function getCurrentData() {
        return currentMode === 'truth' ? truthData : dareData;
    }

    function getCategories() {
        return Object.keys(getCurrentData());
    }

    // ==================== 模式切换 ====================
    function switchMode(mode) {
        currentMode = mode;
        selectedCategory = null;

        // 更新标签样式
        document.querySelectorAll('.mode-tab').forEach(tab => {
            tab.classList.remove('active', 'truth', 'dare');
        });
        const activeTab = document.querySelector(`.mode-tab.${mode === 'truth' ? 'truth' : 'dare'}`);
        if (mode === 'truth') {
            document.querySelector('.mode-tab.truth').classList.add('active', 'truth');
        } else {
            document.querySelector('.mode-tab.dare').classList.add('active', 'dare');
        }

        // 更新抽取按钮
        const drawBtn = document.getElementById('drawBtn');
        drawBtn.className = 'draw-btn ' + (mode === 'truth' ? 'truth-btn' : 'dare-btn');
        drawBtn.textContent = mode === 'truth' ? '🎲 抽取真心话' : '🎯 抽取大冒险';

        // 重置全部按钮
        document.getElementById('allBtn').classList.add('active');
        document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active', 'truth-chip', 'dare-chip'));

        // 重新渲染类别
        renderCategoryChips();
        updateStats();

        // 清空结果
        resetResult();
    }

    // ==================== 类别选择 ====================
    function renderCategoryChips() {
        const container = document.getElementById('categoryChips');
        const categories = getCategories();
        const data = getCurrentData();

        container.innerHTML = categories.map(cat => {
            const count = data[cat].length;
            return `<button class="category-chip" data-category="${cat}" onclick="selectCategory('${cat.replace(/'/g, "\\'")}')">
                ${cat}<span class="count">(${count})</span>
            </button>`;
        }).join('');
    }

    function selectCategory(category) {
        if (selectedCategory === category) {
            // 取消选择，回到全部
            selectedCategory = null;
            document.getElementById('allBtn').classList.add('active');
            document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active', 'truth-chip', 'dare-chip'));
        } else {
            selectedCategory = category;
            document.getElementById('allBtn').classList.remove('active');
            document.querySelectorAll('.category-chip').forEach(c => {
                c.classList.remove('active', 'truth-chip', 'dare-chip');
                if (c.dataset.category === category) {
                    c.classList.add('active');
                    c.classList.add(currentMode === 'truth' ? 'truth-chip' : 'dare-chip');
                }
            });
        }
        updateStats();
        resetResult();
    }

    function selectAllCategories() {
        selectedCategory = null;
        document.getElementById('allBtn').classList.add('active');
        document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active', 'truth-chip', 'dare-chip'));
        updateStats();
        resetResult();
    }

    // ==================== 抽取逻辑 ====================
    function draw() {
        const data = getCurrentData();
        let pool = [];

        if (selectedCategory) {
            pool = data[selectedCategory] || [];
        } else {
            // 合并所有类别
            Object.values(data).forEach(items => {
                pool = pool.concat(items);
            });
        }

        if (pool.length === 0) {
            showResult('暂无内容，请选择其他类别', '', '');
            return;
        }

        // 随机抽取
        const randomIndex = Math.floor(Math.random() * pool.length);
        const drawnItem = pool[randomIndex];

        // 找出所属类别
        let categoryName = selectedCategory || '';
        if (!selectedCategory) {
            for (const [cat, items] of Object.entries(data)) {
                if (items.includes(drawnItem)) {
                    categoryName = cat;
                    break;
                }
            }
        }

        // 动画效果
        const drawBtn = document.getElementById('drawBtn');
        drawBtn.classList.add('spinning');
        setTimeout(() => drawBtn.classList.remove('spinning'), 500);

        // 短暂延迟后显示结果
        const resultCard = document.getElementById('resultCard');
        resultCard.classList.remove('filled');
        void resultCard.offsetWidth; // trigger reflow

        setTimeout(() => {
            showResult(drawnItem, categoryName, currentMode);
            resultCard.classList.add('filled');
        }, 300);
    }

    function showResult(text, category, mode) {
        document.getElementById('resultPlaceholder').style.display = 'none';
        const content = document.getElementById('resultContent');
        content.style.display = 'block';

        const badge = document.getElementById('resultBadge');
        badge.textContent = mode === 'truth' ? '💬 真心话' : '🎯 大冒险';
        badge.className = 'result-badge ' + (mode === 'truth' ? 'truth-badge' : 'dare-badge');

        document.getElementById('resultText').textContent = text;
        document.getElementById('resultCategory').textContent = category ? `📂 ${category}` : '';

        const card = document.getElementById('resultCard');
        card.classList.remove('empty');
    }

    function resetResult() {
        document.getElementById('resultPlaceholder').style.display = 'block';
        document.getElementById('resultContent').style.display = 'none';
        const card = document.getElementById('resultCard');
        card.classList.add('empty');
        card.classList.remove('filled');
    }

    function updateStats() {
        const data = getCurrentData();
        let totalCount = 0;
        let catCount = Object.keys(data).length;

        if (selectedCategory) {
            totalCount = (data[selectedCategory] || []).length;
            document.getElementById('statsBar').textContent =
                `📂 ${selectedCategory} · 共 ${totalCount} 条 · ${currentMode === 'truth' ? '真心话' : '大冒险'}`;
        } else {
            Object.values(data).forEach(items => { totalCount += items.length; });
            document.getElementById('statsBar').textContent =
                `📦 全部 ${catCount} 个类别 · 共 ${totalCount} 条 · ${currentMode === 'truth' ? '真心话' : '大冒险'}`;
        }
    }

    // 键盘快捷键
    document.addEventListener('keydown', function(e) {
        if (e.key === ' ' || e.code === 'Space') {
            e.preventDefault();
            draw();
        } else if (e.key === '1') {
            switchMode('truth');
        } else if (e.key === '2') {
            switchMode('dare');
        }
    });

    // 初始化
    init();
    </script>
</body>
</html>
