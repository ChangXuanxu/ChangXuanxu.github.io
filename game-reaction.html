<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>反应速度测试 - 士多啤梨除草机</title>
    <style>
        /* 全局重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            overflow: hidden;
            background-color: #f8f9fa;
        }

        /* 导航栏 - 保持网站风格统一 */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .navbar-content {
            width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #007bff;
            text-decoration: none;
        }

        .nav-menu a {
            margin: 0 12px;
            color: #333;
            text-decoration: none;
            font-size: 16px;
        }

        .nav-menu a:hover {
            color: #007bff;
        }

        /* 返回按钮 */
        .back-btn {
            position: fixed;
            top: 70px;
            left: 20px;
            padding: 8px 16px;
            background: #6c757d;
            color: white;
            border-radius: 4px;
            text-decoration: none;
            font-size: 14px;
            z-index: 100;
        }

        /* 核心游戏区域 - 全屏 */
        .game-container {
            position: fixed;
            top: 60px;
            left: 0;
            right: 0;
            bottom: 0;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s ease;
            z-index: 10;
        }

        /* 游戏状态文本 */
        .game-status {
            font-size: 32px;
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            user-select: none;
        }

        /* 结果展示区域 */
        .game-result {
            display: none;
            text-align: center;
            margin-bottom: 30px;
        }

        .result-item {
            margin: 10px 0;
        }

        .current-time {
            font-size: 48px;
            font-weight: bold;
            color: #dc3545;
        }

        .avg-time {
            font-size: 28px;
            color: #007bff;
        }

        .rank-text {
            font-size: 20px;
            color: #28a745;
        }

        /* 按钮样式 */
        .game-button {
            padding: 14px 36px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #007bff;
            color: white;
            transition: background 0.2s;
            margin: 0 10px;
        }

        .game-button:hover {
            background: #0056b3;
        }

        .restart-btn {
            background: #ffc107;
            color: #2c3e50;
            display: none;
        }

        .restart-btn:hover {
            background: #e0a800;
        }
        
        /* 添加历史记录显示区域 */
        .history {
            margin-top: 20px;
            max-height: 150px;
            overflow-y: auto;
            width: 80%;
            text-align: center;
        }
        
        .history-title {
            font-size: 18px;
            color: #333;
            margin-bottom: 10px;
        }
        
        .history-list {
            list-style: none;
            padding: 0;
        }
        
        .history-item {
            padding: 5px;
            background: #f1f1f1;
            margin: 3px 0;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="navbar-content">
            <a href="index.html" class="logo">士多啤梨除草机</a>
            <div class="nav-menu">
                <a href="index.html">首页</a>
                <a href="fun-tools.html">趣味组件</a>
                <a href="blog.html">个人博客</a>
                <a href="games.html">小游戏</a>
                <a href="https://space.bilibili.com/2132180406">联系我</a>
            </div>
        </div>
    </nav>

    <!-- 返回按钮 -->
    <a href="games.html" class="back-btn">← 返回小游戏合集</a>

    <!-- 核心游戏区域 -->
    <div class="game-container" id="gameContainer">
        <!-- 状态文本 -->
        <div class="game-status" id="gameStatus">点击开始测试，等待屏幕变蓝后点击屏幕</div>
        
        <!-- 结果展示 -->
        <div class="game-result" id="gameResult">
            <div class="result-item current-time" id="currentTime"></div>
            <div class="result-item avg-time" id="avgTime"></div>
            <div class="result-item rank-text" id="rankText"></div>
        </div>
        
        <!-- 历史记录显示 -->
        <div class="history" id="historySection" style="display: none;">
            <div class="history-title">历史记录</div>
            <ul class="history-list" id="historyList"></ul>
        </div>
        
        <!-- 控制按钮 -->
        <button class="game-button start-btn" id="startBtn">开始测试</button>
        <button class="game-button restart-btn" id="restartBtn">再来一次</button>
        <button class="game-button" id="clearHistoryBtn" style="background: #dc3545; display: none;">清空记录</button>
    </div>

    <script>
        // 核心变量 - 极简设计
        const game = {
            // DOM元素
            container: document.getElementById('gameContainer'),
            status: document.getElementById('gameStatus'),
            result: document.getElementById('gameResult'),
            currentTime: document.getElementById('currentTime'),
            avgTime: document.getElementById('avgTime'),
            rankText: document.getElementById('rankText'),
            startBtn: document.getElementById('startBtn'),
            restartBtn: document.getElementById('restartBtn'),
            clearHistoryBtn: document.getElementById('clearHistoryBtn'),
            historySection: document.getElementById('historySection'),
            historyList: document.getElementById('historyList'),
            
            // 游戏状态
            isTesting: false,    // 是否正在测试中
            isActive: false,     // 屏幕是否已变蓝可点击
            startTime: 0,        // 屏幕变蓝的时间戳
            reactionTimes: [],   // 存储所有有效反应时间
            
            // 初始化
            init() {
                // 从localStorage加载历史数据
                this.loadHistory();
                
                // 绑定事件
                this.startBtn.addEventListener('click', () => this.startTest());
                this.restartBtn.addEventListener('click', () => this.resetGame());
                this.clearHistoryBtn.addEventListener('click', () => this.clearHistory());
                this.container.addEventListener('click', (e) => this.handleClick(e));
                
                // 初始状态
                this.updateHistoryDisplay();
                this.resetGame();
            },
            
            // 从localStorage加载历史记录
            loadHistory() {
                try {
                    const saved = localStorage.getItem('reactionTimes');
                    if (saved) {
                        this.reactionTimes = JSON.parse(saved);
                    } else {
                        this.reactionTimes = [];
                    }
                } catch (e) {
                    console.error('加载历史记录失败:', e);
                    this.reactionTimes = [];
                }
            },
            
            // 保存历史记录到localStorage
            saveHistory() {
                try {
                    localStorage.setItem('reactionTimes', JSON.stringify(this.reactionTimes));
                } catch (e) {
                    console.error('保存历史记录失败:', e);
                }
            },
            
            // 清空历史记录
            clearHistory() {
                this.reactionTimes = [];
                this.saveHistory();
                this.updateHistoryDisplay();
                this.resetGame();
            },
            
            // 更新历史记录显示
            updateHistoryDisplay() {
                if (this.reactionTimes.length > 0) {
                    this.historySection.style.display = 'block';
                    this.clearHistoryBtn.style.display = 'inline-block';
                    
                    // 清空列表
                    this.historyList.innerHTML = '';
                    
                    // 添加历史记录项（只显示最近10条）
                    const recentTimes = this.reactionTimes.slice(-10);
                    recentTimes.forEach((time, index) => {
                        const li = document.createElement('li');
                        li.className = 'history-item';
                        li.textContent = `#${this.reactionTimes.length - recentTimes.length + index + 1}: ${time}ms`;
                        this.historyList.appendChild(li);
                    });
                } else {
                    this.historySection.style.display = 'none';
                    this.clearHistoryBtn.style.display = 'none';
                }
            },
            
            // 在测试过程中隐藏记录和按钮
            hideDuringTest() {
                this.historySection.style.display = 'none';
                // 注意：不要隐藏clearHistoryBtn，因为它的显示状态由updateHistoryDisplay管理
                this.restartBtn.style.display = 'none';
            },
            
            // 测试结束后显示记录和按钮
            showAfterTest() {
                this.updateHistoryDisplay(); // 这会根据是否有历史记录来决定是否显示clearHistoryBtn
            },
            
            // 开始测试
            startTest() {
                // 重置UI
                this.startBtn.style.display = 'none';
                this.result.style.display = 'none';
                this.container.style.background = '#ffffff';
                
                // 隐藏记录和按钮（避免测试过程中的干扰）
                this.hideDuringTest();
                
                // 更新状态
                this.isTesting = true;
                this.isActive = false;
                this.status.textContent = '等待屏幕变蓝...';
                
                // 随机延迟 1-5 秒后变蓝
                const delay = Math.floor(Math.random() * 4000) + 1000;
                setTimeout(() => {
                    // 防止测试已终止仍触发
                    if (!this.isTesting) return;
                    
                    // 屏幕变蓝，激活点击
                    this.container.style.background = '#007bff';
                    this.status.textContent = '立即点击屏幕！';
                    this.startTime = Date.now();
                    this.isActive = true;
                    this.isTesting = false;
                }, delay);
            },
            
            // 处理点击事件（核心逻辑）
            handleClick(e) {
                // 过滤按钮点击（只响应空白区域）
                if (e.target === this.startBtn || e.target === this.restartBtn || e.target === this.clearHistoryBtn) {
                    return;
                }
                
                // 1. 未开始测试 - 无反应
                if (!this.isTesting && !this.isActive) {
                    return;
                }
                
                // 2. 提前点击（作弊）
                if (this.isTesting && !this.isActive) {
                    this.isTesting = false;
                    this.status.textContent = '作弊！请等待屏幕变蓝';
                    this.startBtn.style.display = 'inline-block';
                    // 如果之前隐藏了记录，在作弊时也应恢复显示
                    this.updateHistoryDisplay();
                    return;
                }
                
                // 3. 有效点击（屏幕已变蓝）
                if (this.isActive) {
                    // 计算反应时间
                    const endTime = Date.now();
                    const time = endTime - this.startTime;
                    
                    // 只记录有效时间（0-10秒）
                    if (time > 0 && time < 10000) {
                        this.reactionTimes.push(time);
                        this.saveHistory(); // 保存到本地存储
                    }
                    
                    // 重置状态
                    this.isActive = false;
                    this.container.style.background = '#ffffff';
                    
                    // 显示结果
                    this.showResult(time);
                }
            },
            
            // 显示测试结果
            showResult(time) {
                // 本轮时间
                this.currentTime.textContent = `${time} ms`;
                
                // 平均时间 - 计算所有历史记录的平均值
                const avg = this.reactionTimes.length > 0 
                    ? Math.round(this.reactionTimes.reduce((a, b) => a + b) / this.reactionTimes.length)
                    : 0;
                this.avgTime.textContent = `平均：${avg} ms`;
                
                // 评级
                let rank = '';
                if (time < 150) rank = '超神！职业选手水平';
                else if (time < 200) rank = '优秀！远超普通人';
                else if (time < 300) rank = '良好！高于平均';
                else if (time < 400) rank = '及格！普通水平';
                else rank = '加油！多玩能提升';
                this.rankText.textContent = rank;
                
                // 更新UI
                this.status.textContent = '测试完成';
                this.result.style.display = 'block';
                this.restartBtn.style.display = 'inline-block';
                
                // 测试结束后显示记录和按钮
                this.showAfterTest();
            },
            
            // 重置游戏（但保留历史记录）
            resetGame() {
                // 重置状态（但保留反应时间历史）
                this.isTesting = false;
                this.isActive = false;
                
                // 重置UI
                this.container.style.background = '#ffffff';
                this.status.textContent = '点击开始测试，等待屏幕变蓝';
                this.result.style.display = 'none';
                this.startBtn.style.display = 'inline-block';
                this.restartBtn.style.display = 'none';
                
                // 显示历史记录（如果有的话）
                this.updateHistoryDisplay();
            }
        };

        // 初始化游戏
        game.init();
    </script>
</body>
</html>
